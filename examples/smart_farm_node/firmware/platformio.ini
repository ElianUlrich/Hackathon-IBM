[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    ; soil_1 — no library required (ADC only)
    ; ds18b20_1
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    ; bme280_1
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; relay_1 — no library required (GPIO only)
    ; ili9341_1 / display
    Bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2.2

build_flags =
    ; ── TFT_eSPI: configure via build_flags only (never edit .pio/libdeps/) ──
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_MISO=19
    -D TFT_CS=27
    -D TFT_DC=16
    -D TFT_RST=17
    -D SPI_FREQUENCY=40000000
    ; ── LVGL: pick up lv_conf.h from include/ ────────────────────────────────
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
